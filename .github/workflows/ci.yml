name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON data files
        run: |
          for f in site/data/*.json; do
            jq -e . "$f" > /dev/null || { echo "INVALID JSON: $f"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JS syntax check
        run: npm run check

      - name: Install test dependencies
        run: npm install --no-fund --no-audit

      - name: Filter engine tests
        run: npm test

      - name: Generated pages match data (drift guard)
        run: |
          python3 scripts/build-pages.py
          git diff --exit-code -- site/m site/r site/sitemap.xml \
            || { echo "site/m, site/r or sitemap.xml is stale — run scripts/build-pages.py and commit"; exit 1; }
